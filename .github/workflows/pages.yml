# Publica o Flow no GitHub Pages (flow.somoslidera.com.br) a cada merge na main.
# Só os arquivos do site vão para o domínio. tools/, supabase/ e os .md ficam
# só no repo. Para incluir um arquivo novo no site, acrescente-o na lista abaixo.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar só os arquivos do site
        run: |
          mkdir _publicar
          cp index.html versao.json CNAME _publicar/
          cp -R pdv _publicar/pdv
          touch _publicar/.nojekyll
          find _publicar -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar

      - id: deploy
        uses: actions/deploy-pages@v4
