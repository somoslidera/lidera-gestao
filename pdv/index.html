<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10203f">
<meta name="robots" content="noindex,nofollow">
<title>Flow PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1D3573;--navy-700:#172b5e;--navy-900:#10203f;--gold:#A48A57;--gold-soft:#C2A875;
 --bg:#F3F4F8;--card:#FFFFFF;--line:#E4E7EE;--ink:#1B2235;--muted:#6B7384;--soft:#9AA1B1;--hover:#F0F2F8;
 --green:#1E9E6A;--green-bg:#E5F4EC;--red:#D2483F;--red-bg:#FBE9E7;--amber:#C9892A;--amber-bg:#FBF1DE;
 --radius:16px;--shadow:0 1px 2px rgba(16,32,63,.04),0 8px 24px rgba(16,32,63,.06);--shadow-lg:0 18px 60px rgba(16,32,63,.22);--accent:var(--navy)}
:root[data-tema="escuro"]{--bg:#0C1322;--card:#141D31;--line:#243049;--ink:#EEF1F8;--muted:#9AA6BE;--soft:#6F7B93;--hover:#1B2640;
 --green-bg:#11352A;--red-bg:#3A1A1A;--amber-bg:#3A2C12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--accent:#8FA8E8}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.brand b{font:600 22px Fraunces,serif;letter-spacing:.2px}.brand span{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
.rest{font-size:13px;color:#C9D2E6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw}
.nav{display:flex;gap:4px;margin-left:8px}.nav button{padding:8px 14px;border-radius:10px;color:#C9D2E6;font-weight:600;font-size:14px}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}.nav button:hover{background:rgba(255,255,255,.08)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft)}.dot.ok{background:#3DDC97}.dot.warn{background:#F5B942}.dot.off{background:#F26D61}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#C9D2E6;font-size:17px}.ibtn:hover{background:rgba(255,255,255,.1)}
/* base */
.wrap{padding:16px 18px 28px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;min-height:44px;transition:transform .05s,background .15s}
.btn:active{transform:scale(.98)}.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy-700)}
.btn-g{background:var(--gold);color:#fff}.btn-g:hover{filter:brightness(.95)}
.btn-o{border:1px solid var(--line);background:var(--card)}.btn-o:hover{background:var(--hover)}
.btn-d{background:var(--red-bg);color:var(--red)}.btn-ok{background:var(--green);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}.btn-xl{min-height:58px;font-size:17px;border-radius:14px}.btn-sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,53,115,.12)}
label.lb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;letter-spacing:.2px}
.kicker{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.muted{color:var(--muted)}.mini{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag-g{background:var(--green-bg);color:var(--green)}.tag-r{background:var(--red-bg);color:var(--red)}.tag-a{background:var(--amber-bg);color:var(--amber)}.tag-n{background:var(--hover);color:var(--muted)}
/* venda */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.painel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.kpi .v{font:600 22px Fraunces,serif;line-height:1.15}.kpi .l{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.bal{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;margin-bottom:14px;overflow:hidden}
.bal-l{padding:18px 20px;background:linear-gradient(145deg,var(--navy-900),var(--navy));color:#fff}
.bal-r{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.peso{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.peso input{width:100%;background:transparent;border:0;outline:0;color:#fff;font:600 64px/1 Fraunces,serif;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.peso input::placeholder{color:rgba(255,255,255,.35)}.peso span{font:600 22px Fraunces,serif;color:var(--gold-soft)}
.bal-st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9D2E6;font-weight:600}
.bal-sub{font-size:13px;color:#C9D2E6;margin-top:6px}
.bal-val{font:600 34px Fraunces,serif;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cat-top{padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 16px;max-height:calc(100vh - 430px);min-height:220px;overflow:auto}
.prod{text-align:left;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:86px}
.prod:hover{border-color:var(--accent);background:var(--hover)}.prod b{font-size:13.5px;line-height:1.25;font-weight:600}.prod span{font:600 15px Fraunces,serif;color:var(--gold)}
.cmd{display:flex;flex-direction:column;position:sticky;top:72px;max-height:calc(100vh - 88px)}
.cmd-top{padding:14px 16px 10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;border-bottom:1px solid var(--line)}
.cmd-top input{font:600 26px Fraunces,serif;padding:8px 12px}
.abertas{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--line)}.abertas:empty{display:none}
.ab{flex:0 0 auto;padding:6px 11px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}.ab.on{border-color:var(--gold);background:var(--amber-bg)}
.cmd-itens{flex:1;overflow:auto;padding:6px 16px;min-height:150px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it b{font-weight:600;font-size:14px}.it .v{font-weight:700;font-variant-numeric:tabular-nums}
.qt{display:inline-flex;align-items:center;gap:6px}.qt button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);font-weight:700}.qt button:hover{background:var(--hover)}
.vazio{padding:34px 10px;text-align:center;color:var(--muted);font-size:13.5px}
.cmd-tot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.cmd-tot b{font:600 30px Fraunces,serif}
.cmd-ac{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.aviso{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--amber-bg);color:var(--amber);font-weight:600;margin-bottom:14px;flex-wrap:wrap}
/* tabelas */
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
h2{font:600 22px Fraunces,serif;margin:0 0 4px}h3{font:600 17px Fraunces,serif;margin:0 0 10px}
.linha{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.linha:last-child{border-bottom:0}.linha b{font-variant-numeric:tabular-nums}
.barras{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}.barras div{flex:1;max-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--muted)}
.barras i{display:block;width:100%;background:var(--navy);border-radius:5px 5px 0 0;min-height:2px}:root[data-tema="escuro"] .barras i{background:var(--accent)}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,18,36,.55);padding:16px}
#modalRoot.on{display:flex}.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:92vh;overflow:auto}
.modal.lg{width:min(760px,100%)}.m-h{padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:center}.m-b{padding:8px 22px 16px}.m-f{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pg-total{font:600 44px Fraunces,serif;line-height:1}.meios{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.meio{padding:14px 10px;border:1px solid var(--line);border-radius:14px;font-weight:600;text-align:center;min-height:56px}.meio:hover{border-color:var(--accent);background:var(--hover)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy-900);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#24408a 0,var(--navy-900) 55%)}
.auth-c{width:min(420px,100%);background:#fff;color:#1B2235;border-radius:22px;padding:30px 28px;box-shadow:var(--shadow-lg)}
.auth-c .input{background:#fff;color:#1B2235;border-color:#E4E7EE}
.org{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid #E4E7EE;border-radius:12px;margin-bottom:8px;font-weight:600;color:#1B2235}.org:hover{border-color:var(--navy);background:#F0F2F8}
#printArea{display:none}
/* mesas, conta, cozinha, balança de autoatendimento */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mesa{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);min-height:112px}
.mesa b{font:600 18px Fraunces,serif}.mesa .v{font-weight:700;font-size:16px}.mesa:hover{border-color:var(--accent)}
.mesa.ocup{background:var(--navy);border-color:var(--navy);color:#fff}.mesa.ocup .mini{color:#C9D2E6}.mesa.conta{background:var(--amber-bg);border-color:var(--gold)}
.conta{max-width:760px;margin:0 auto}.conta-ac{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.conta-ac .btn-xl{grid-column:span 3}.conta-ac .btn-o{grid-column:span 2;background:var(--card)}.conta-ac .btn-o:nth-last-child(-n+2){grid-column:span 3}
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcard{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);border-left:6px solid var(--navy);background:var(--card);margin-bottom:10px;box-shadow:var(--shadow)}
.kcard.preparo{border-left-color:var(--amber)}.kcard.pronto{border-left-color:var(--green)}.kcard.atras{border-left-color:var(--red);background:var(--red-bg)}
.kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.kh b{font:600 20px Fraunces,serif}.kh span{font-size:13px;font-weight:700;color:var(--muted)}
.kl{font-size:17px;line-height:1.35;padding:3px 0}.ko{font-size:14px;font-weight:700;color:var(--red);padding-left:26px}.kf{font-size:12px;color:var(--muted);margin-top:8px}
.totem{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);min-height:calc(100vh - 130px)}
.tot-l{padding:34px 38px;background:linear-gradient(150deg,var(--navy-900),var(--navy));color:#fff;display:flex;flex-direction:column;justify-content:center}
.tot-l .peso input{font-size:112px}.tot-r{padding:30px 34px;background:var(--card);display:flex;flex-direction:column;justify-content:center}
.tot-num{font:600 76px/1.1 Fraunces,serif;text-align:center;min-height:86px;margin:4px 0 18px;border-bottom:2px solid var(--line)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.teclado button{min-height:78px;border-radius:18px;border:1px solid var(--line);font:600 30px Fraunces,serif;background:var(--card)}
.teclado button:active{background:var(--hover)}.teclado .ok{background:var(--green);border-color:var(--green);color:#fff;font:600 18px Inter,sans-serif}
.tot-ok{text-align:center;padding:30px 10px}
#pinRoot{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,18,36,.6);padding:16px}
@media (max-width:1050px){.pdv{grid-template-columns:1fr}.cmd{position:static;max-height:none}.grid{max-height:none}.painel{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.rest{display:none}}
@media (max-width:900px){.kds{grid-template-columns:1fr}.totem{grid-template-columns:1fr}.tot-l .peso input{font-size:72px}.conta-ac{grid-template-columns:repeat(2,1fr)}.conta-ac .btn,.conta-ac .btn-xl,.conta-ac .btn-o:nth-last-child(-n+2){grid-column:span 1}.conta-ac .btn-xl{grid-column:span 2}}
@media (max-width:640px){.wrap{padding:12px}.top{padding-left:12px;padding-right:12px;gap:8px;flex-wrap:wrap}.nav{order:3;width:100%;margin:0;overflow:auto}.nav button{flex:1}.bal{grid-template-columns:1fr}.peso input{font-size:52px}.painel{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.brand span{display:none}}
@media print{body>*{display:none!important}#printArea{display:block!important;color:#000;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:2mm}
 #printArea h4{font:700 14px/1.2 ui-monospace,monospace;margin:0 0 2px;text-align:center}#printArea .c{text-align:center}#printArea hr{border:0;border-top:1px dashed #000;margin:5px 0}
 #printArea .l{display:flex;justify-content:space-between;gap:8px}#printArea .t{font-weight:700;font-size:14px}@page{margin:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot" onclick="if(event.target===this)fecharModal()"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
'use strict';
/* Flow PDV · estágio 1 (buffet presencial). Aplicativo separado do Flow: não grava a base do Flow diretamente.
   Online por padrão: cada registro vai para a nuvem na hora e os terminais se atualizam em tempo real.
   Se a internet cair, continua vendendo: os registros ficam no aparelho e sobem sozinhos quando a conexão volta.
   O fechamento do caixa vai ao Flow pela API pública /v1/vendas. */
const VERSAO='Estágio 2 · 11/11/2026';
const SUPA_URL='https://fvcbxorfstqqeewocxkf.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2Y2J4b3Jmc3RxcWVld29jeGtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzM5MjgsImV4cCI6MjA5Njg0OTkyOH0.X9gnZt535F1ASHpUaL24eEZysHHECwzfBwjaR4kVnyw';
const API_FLOW=SUPA_URL+'/functions/v1/flow-api';
const QS=new URLSearchParams(location.search),DEMO=QS.has('demo')||!/^https?:$/.test(location.protocol);   // aberto direto do arquivo: abre a demonstração
let sb=null;
try{if(!DEMO&&window.supabase)sb=window.supabase.createClient(SUPA_URL,SUPA_ANON,{auth:{storageKey:'fpdv-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});}catch(e){sb=null;}

/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100,r3=n=>Math.round((+n||0)*1000)/1000;
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fkg=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const fq=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
function num(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0;}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}));
const pad=n=>String(n).padStart(2,'0');
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fData=iso=>{const p=String(iso||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'';};
const fHora=ts=>{try{return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
const normTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
let _tt=null;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),ms||2600);}
function bip(ok){try{const C=bip.c||(bip.c=new (window.AudioContext||window.webkitAudioContext)());const o=C.createOscillator(),g=C.createGain();o.frequency.value=ok===false?220:880;g.gain.value=.06;o.connect(g);g.connect(C.destination);o.start();o.stop(C.currentTime+(ok===false?.25:.09));}catch(e){}}
function modal(html,lg){const r=$('#modalRoot');r.innerHTML='<div class="modal'+(lg?' lg':'')+'">'+html+'</div>';r.classList.add('on');setTimeout(()=>{const f=$('[autofocus]',r);if(f){f.focus();if(f.select)f.select();}},40);}
function fecharModal(){const r=$('#modalRoot');r.classList.remove('on');r.innerHTML='';}
const modalAberto=()=>$('#modalRoot').classList.contains('on');

/* ---------- armazenamento local (IndexedDB) ---------- */
const IDB={db:null,mem:{ev:new Map(),kv:new Map()},
  open(){return new Promise(res=>{try{const rq=indexedDB.open(DEMO?'fpdv-demo':'fpdv',1);
    rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('ev'))d.createObjectStore('ev',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};

  SYNCING=true;let mudou=false;

    const pend=EV.filter(e=>!e._s);
    for(let i=0;i<pend.length;i+=200){const lote=pend.slice(i,i+200);
      const rows=lote.map(e=>({id:e.id,org_id:CTX.orgId,tipo:e.tipo,caixa_id:e.caixa_id,ref:e.ref,dados:e.dados||{},terminal:e.terminal||'',criado_em:e.criado_em}));
      const r=await sb.from('fpdv_eventos').upsert(rows,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
      lote.forEach(e=>{e._s=1;});await IDB.putEvs(lote);}
    const corte=new Date(Date.now()-DIAS_GUARDA*864e5).toISOString();
    for(let g=0;g<30;g++){
      let q=sb.from('fpdv_eventos').select('id,seq,tipo,caixa_id,ref,dados,terminal,criado_em').eq('org_id',CTX.orgId).gt('seq',CURSOR).order('seq').limit(1000);
      if(!CURSOR)q=q.or('criado_em.gte.'+corte+',tipo.eq.cfg');
      const r=await q;if(r.error)throw r.error;const rows=r.data||[];const novos=[];
      rows.forEach(x=>{CURSOR=Math.max(CURSOR,+x.seq||0);if(!IDX.has(x.id)){const e={id:x.id,org_id:CTX.orgId,tipo:x.tipo,caixa_id:x.caixa_id,ref:x.ref,dados:x.dados||{},terminal:x.terminal||'',criado_em:x.criado_em,_s:1};EV.push(e);IDX.add(e.id);novos.push(e);}});
      if(novos.length){await IDB.putEvs(novos);mudou=true;}
      if(rows.length<1000)break;}
    await IDB.set('cur:'+CTX.orgId,CURSOR);SYNC_EM=Date.now();SYNC_ERR='';
  }catch(e){SYNC_ERR=(e&&(e.message||e.code))||String(e);
    if(/fpdv_eventos|42P01|PGRST205|PGRST106|schema cache/i.test(SYNC_ERR+' '+((e&&e.code)||'')))CLOUD_OK=false;}   // tabela ainda não criada: segue em modo local
  SYNCING=false;if(mudou){rebuild();refresh();}statusUI();
  if(SYNC_DENOVO){SYNC_DENOVO=false;setTimeout(syncNow,60);}
}
function statusUI(){const el=$('#stSync');if(!el)return;const p=pendentes();let c='ok',t='Online';

const BAL={port:null,reader:null,on:false,kg:0,ult:[],buf:''};

const balEstavel=()=>BAL.ult.length>=3&&BAL.ult.every(x=>Math.abs(x-BAL.ult[0])<0.002);
function pesoBruto(){if(BAL.on)return BAL.kg;const el=$('#pesoIn');if(!el)return 0;const raw=String(el.value||'').trim();if(!raw)return 0;let v=num(raw);if(!/[.,]/.test(raw)&&v>=30)v=v/1000;return r3(v);}   // sem vírgula e acima de 30: gramas
function pesoSel(){const c=cfg();return c.pesos.find(p=>p.id===UI.pesoId)||c.pesos[0];}
function taraSel(){const c=cfg();if(UI.taraId==='__sem')return {id:'__sem',nome:'Sem tara',kg:0};return c.taras.find(t=>t.id===UI.taraId)||c.taras[0]||{id:'__sem',nome:'Sem tara',kg:0};}
function pesoCalc(){const b=pesoBruto(),t=+taraSel().kg||0,l=Math.max(0,r3(b-t)),p=precoKgDe(pesoSel());return {bruto:b,tara:t,liq:l,preco:p,valor:r2(l*p)};}
function lancarPeso(){const pc=pesoCalc(),p=pesoSel();
  if(!(pc.preco>0))return toast('Defina o preço por quilo em Ajustes');
  if(!(pc.liq>0))return (bip(false),toast('Sem peso na balança'));
  if(BAL.on&&!balEstavel())return (bip(false),toast('Aguarde o peso estabilizar'));
  const n=$('#cmdNum');sincNum();
  if(LOCAL.autoGuardar&&!String(CUR.numero||'').trim()&&!CUR.comandaId){bip(false);if(n)n.focus();return toast('Digite o número da comanda');}
  addItem({tipo:'peso',prodId:p.id,nome:p.nome,codigo:p.codigo||'',qtd:pc.liq,preco:pc.preco,total:pc.valor,bruto:pc.bruto,tara:pc.tara});
  bip();const el=$('#pesoIn');if(el&&!BAL.on)el.value='';
  const num0=CUR.numero;if(LOCAL.autoGuardar){guardar(true);toast('Comanda '+num0+' · '+fkg(pc.liq)+' kg · '+brl(pc.valor));}
  refresh();}

  return {fichas,meios:(c.meios||[]).filter(m=>m&&m.nome).map(m=>({id:String(m.id||m.nome),nome:String(m.nome),tipo:String(m.tipo||'')})),precoKg:num(c.precoKg),restaurante:String(c.restaurante||c.nome||''),em:Date.now()};}

      f('b1','Pudim de leite','Sobremesas',9),f('b2','Mousse de maracujá','Sobremesas',8),f('b3','Sorvete duas bolas','Sobremesas',10),
      f('c1','Buffet livre','Buffet',54.9),f('c2','Marmita pequena','Buffet',22),f('c3','Marmita grande','Buffet',28),f('c4','Churrasco adicional 100 g','Buffet',12)]});}
async function baixarCatalogo(){if(!sb||DEMO||!CTX)return null;let c=null;
  try{const r=await sb.rpc('fpdv_catalogo',{p_org:CTX.orgId});if(!r.error&&r.data)c=r.data;}catch(e){}
  if(!c){try{const r=await sb.from('organizacoes').select('nome,precoKg:dados->buffet->precoVendaKg,restaurante:dados->conta->>restaurante,meios:dados->fin->meios,fichas:dados->fichas').eq('id',CTX.orgId).maybeSingle();
    if(r.data)c={nome:r.data.nome,restaurante:r.data.restaurante||r.data.nome,precoKg:r.data.precoKg,meios:r.data.meios||[],fichas:Object.values(r.data.fichas||{}).map(x=>({id:x.id,nome:x.nome,cat:x.cat,preco:x.precoVenda,cod:x.codPdv}))};}catch(e){}}
  if(!c)return null;CAT=normCat(c);if(!CAT.restaurante)CAT.restaurante=CTX.orgNome;await IDB.set('cat:'+CTX.orgId,CAT);return CAT;}

/* ---------- entrada ---------- */
function aplicarTema(){const t=LOCAL.tema==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro'):LOCAL.tema;document.documentElement.dataset.tema=t;}
function trocarTema(){LOCAL.tema=document.documentElement.dataset.tema==='escuro'?'claro':'escuro';aplicarTema();IDB.set('local',LOCAL);}
function telaLogin(msg){$('#app').innerHTML=`<div class="auth"><form class="auth-c" onsubmit="login(event)">
  <div style="text-align:center;margin-bottom:20px"><div style="font:600 36px Fraunces,serif;color:#1D3573">Flow <span style="color:#A48A57">PDV</span></div><div class="kicker" style="margin-top:2px">by Lidera</div></div>
  <label class="lb">E-mail</label><input class="input" id="lgEmail" type="email" autocomplete="username" required autofocus>
  <label class="lb" style="margin-top:12px">Senha</label><input class="input" id="lgPass" type="password" autocomplete="current-password" required>
  <div id="lgErr" style="color:#D2483F;font-size:13px;min-height:20px;margin:8px 0">${esc(msg||'')}</div>
  <button class="btn btn-p btn-xl" id="lgBtn" style="width:100%">Entrar</button>
  <div class="mini" style="text-align:center;margin-top:14px">Use o mesmo e-mail e a mesma senha do Flow.</div></form></div>`;}
async function login(ev){ev.preventDefault();if(!sb)return;const b=$('#lgBtn');b.disabled=true;$('#lgErr').textContent='';
  try{const {data,error}=await sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgPass').value});
    if(error||!data||!data.user){$('#lgErr').textContent='E-mail ou senha inválidos.';b.disabled=false;return;}await escolherOrg(data.user);}
  catch(e){$('#lgErr').textContent='Sem conexão. Tente de novo.';b.disabled=false;}}
async function escolherOrg(user){USER={id:user.id,email:user.email||''};let perfil=null,orgs=[];
  try{perfil=(await sb.from('perfis').select('papel,org_id').eq('id',user.id).maybeSingle()).data;}catch(e){}
  try{if(perfil&&(perfil.papel==='admin'||perfil.papel==='consultor'))orgs=(await sb.from('organizacoes').select('id,nome,status').order('nome').limit(600)).data||[];
    else{orgs=(await sb.from('organizacoes').select('id,nome,status').eq('consultor_id',user.id)).data||[];
      if(perfil&&perfil.org_id&&!orgs.some(o=>o.id===perfil.org_id)){const o=(await sb.from('organizacoes').select('id,nome,status').eq('id',perfil.org_id).maybeSingle()).data;if(o)orgs.unshift(o);}}}catch(e){}
  orgs=orgs.filter(o=>o&&o.status!=='suspenso');
  if(!orgs.length)return telaLogin('Sua conta ainda não tem restaurante liberado.');
  if(orgs.length===1)return entrar(orgs[0].id,orgs[0].nome);
  window._orgs=orgs;$('#app').innerHTML=`<div class="auth"><div class="auth-c" style="width:min(480px,100%)"><div style="font:600 24px Fraunces,serif;color:#1D3573;margin-bottom:4px">Escolha o restaurante</div>
    <div class="mini" style="margin-bottom:12px">O PDV abre um restaurante por vez neste aparelho.</div>
    <input class="input" placeholder="Buscar" oninput="orgsUI(this.value)" autofocus><div id="orgsL" style="margin-top:12px;max-height:52vh;overflow:auto"></div>
    <div style="text-align:center;margin-top:12px"><a class="mini" style="cursor:pointer;text-decoration:underline" onclick="sair()">Sair</a></div></div></div>`;orgsUI('');}
function orgsUI(b){b=normTxt(b);$('#orgsL').innerHTML=(window._orgs||[]).filter(o=>!b||normTxt(o.nome).includes(b)).slice(0,80).map(o=>`<button class="org" onclick="entrar('${o.id}',this.textContent)">${esc(o.nome||'Sem nome')}</button>`).join('')||'<div class="mini">Nada encontrado.</div>';}
let _loop=null;
async function entrar(orgId,nome){CTX={orgId,orgNome:String(nome||'').trim(),userId:USER.id,email:USER.email};await IDB.set('ctx',CTX);
  $('#app').innerHTML='<div class="auth"><div style="color:#fff;font:600 20px Fraunces,serif">Abrindo o caixa…</div></div>';
  const cache=await IDB.get('cat:'+orgId);
  if(cache&&cache.fichas){CAT=cache;baixarCatalogo().then(c=>{if(c)refresh(true);});}else{CAT={fichas:[],meios:[],precoKg:0,restaurante:CTX.orgNome};await baixarCatalogo();}
  await carregarEventos();CUR={comandaId:null,numero:''};ROUTE=navs()[0][0];CLOUD_OK=!!sb;
  if(sb&&navigator.onLine)await Promise.race([syncNow(),new Promise(r=>setTimeout(r,4000))]);   // online: abre já com o que está na nuvem
  render();syncNow();rtLigar();balAuto();
  clearInterval(_loop);_loop=setInterval(tique,5000);}
let _catTent=0;
function tique(){if(document.hidden||!CTX)return;
  if((ROUTE==='cozinha'||(ROUTE==='mesas'&&!CONTA))&&!modalAberto())refresh();   // tempo decorrido dos pedidos e das mesas
  if(DEMO)return;
  if(!RT_OK||pendentes()||Date.now()-SYNC_EM>20000)syncNow();   // com tempo real ligado, a busca periódica é só reserva
  if(navigator.onLine&&Date.now()-(CAT.em||0)>600000&&Date.now()-_catTent>120000){_catTent=Date.now();baixarCatalogo().then(c=>{if(c&&ROUTE==='venda'){catUI();pesoUI();}});}}   // preço mudou no Flow: chega em até 10 minutos
async function sair(){if(CTX&&pendentes()&&!confirm('Há '+pendentes()+' registro(s) ainda não enviados para a nuvem. Eles ficam guardados neste aparelho. Sair mesmo assim?'))return;
  rtDesligar();try{if(sb)await sb.auth.signOut();}catch(e){}await IDB.set('ctx',null);location.reload();}
async function trocarRestaurante(){if(!sb)return;let s=null;try{s=(await sb.auth.getSession()).data.session;}catch(e){}if(!s)return telaLogin();clearInterval(_loop);rtDesligar();CTX=null;await IDB.set('ctx',null);escolherOrg(s.user);}
async function boot(){await IDB.open();Object.assign(LOCAL,(await IDB.get('local'))||{});aplicarTema();
  if(DEMO){USER={id:'demo',email:'demonstracao'};CTX={orgId:'demo',orgNome:'Restaurante Demonstração',userId:'demo',email:'demonstracao'};CAT=catDemo();CLOUD_OK=false;await carregarEventos();ROUTE=navs()[0][0];render();clearInterval(_loop);_loop=setInterval(tique,5000);return;}
  const ctx=await IDB.get('ctx');let sess=null;try{if(sb)sess=(await sb.auth.getSession()).data.session;}catch(e){}
  if(sess&&ctx&&ctx.userId===sess.user.id){USER={id:sess.user.id,email:sess.user.email||''};return entrar(ctx.orgId,ctx.orgNome);}
  if(sess)return escolherOrg(sess.user);
  if(ctx&&(!navigator.onLine||!sb)){USER={id:ctx.userId,email:ctx.email};return entrar(ctx.orgId,ctx.orgNome);}   // sem internet: segue vendendo com o último acesso deste aparelho
  if(!sb){$('#app').innerHTML='<div class="auth"><div class="auth-c">Sem conexão para o primeiro acesso. Conecte à internet e recarregue.</div></div>';return;}
  telaLogin();}

const NAVS={caixa:[['venda','Venda'],['mesas','Mesas'],['cozinha','Cozinha'],['balanca','Balança'],['caixa','Caixa'],['vendas','Vendas'],['relatorios','Relatórios'],['ajustes','Ajustes']],

function painelUI(){const el=$('#painel');if(!el)return;const cx=cxAtual();const r=cx?resumoCaixa(cx):{n:0,total:0,ticket:0,pesoMedio:0};const ab=comandasAbertas();

function balCardUI(){const el=$('#balCard');if(!el)return;const c=cfg();const ant=$('#pesoIn');const antV=ant&&!BAL.on?ant.value:'';
  el.innerHTML=`<div class="bal-l"><div class="bal-st"><i class="dot" id="balDot"></i><span id="balTxt"></span></div>
    <div class="peso"><input id="pesoIn" class="num" inputmode="decimal" placeholder="0,000" autocomplete="off" oninput="pesoUI()" onkeydown="if(event.key==='Enter'){event.preventDefault();lancarPeso();}"><span>kg</span></div>

    ${c.taras.length?`<div><label class="lb">Tara</label><div class="chips">${c.taras.map(t=>`<button class="chip ${taraSel().id===t.id?'on':''}" onclick="UI.taraId='${t.id}';balCardUI()">${esc(t.nome)} ${fkg(t.kg)}</button>`).join('')}<button class="chip ${taraSel().id==='__sem'?'on':''}" onclick="UI.taraId='__sem';balCardUI()">Sem tara</button></div></div>`:''}
    <div style="margin-top:auto"><div class="mini" id="balConta"></div><div class="bal-val num" id="balValor"></div></div>
    <button class="btn btn-p btn-xl" onclick="lancarPeso()">Lançar peso <span style="opacity:.7;font-size:12px">F2</span></button></div>`;
  if(antV)$('#pesoIn').value=antV;pesoUI();}
function pesoUI(){const inp=$('#pesoIn');if(!inp)return;const dot=$('#balDot'),txt=$('#balTxt');
  if(BAL.on){inp.readOnly=true;inp.value=fkg(BAL.kg);const ok=balEstavel();dot.className='dot '+(ok?'ok':'warn');txt.textContent=(BAL.sim?'Simulador':'Balança conectada')+(ok?' · peso estável':' · lendo');}
  else{inp.readOnly=false;dot.className='dot';if(!txt.dataset.m){txt.dataset.m='1';txt.innerHTML='Digite o peso ou <a style="color:#fff;text-decoration:underline;cursor:pointer" onclick="balConectar()">conecte a balança</a>';}}
  if(BAL.on)delete txt.dataset.m;
  const pc=pesoCalc();$('#balSub').textContent=pc.tara>0?('Bruto '+fkg(pc.bruto)+' kg · tara '+fkg(pc.tara)+' kg · líquido '+fkg(pc.liq)+' kg'):('Líquido '+fkg(pc.liq)+' kg');
  $('#balConta').textContent=fkg(pc.liq)+' kg × '+brl(pc.preco)+' o quilo';$('#balValor').textContent=brl(pc.valor);}

  const v=r3((+taraSel().kg||0)+0.28+Math.random()*0.55);BAL.sim=true;BAL.on=true;BAL.kg=v;BAL.ult=[v,v,v];pesoUI();}
function catUI(soGrid){const off=cfg().itensOff;const fs=CAT.fichas.filter(f=>!off.includes(f.id));const cats=['Todos',...new Set(fs.map(f=>f.cat))];if(!cats.includes(UI.cat))UI.cat='Todos';

    <label class="lb" style="margin-top:12px">Valor recebido nesta forma</label><input class="input num" id="pgValor" inputmode="decimal" style="font:600 24px Fraunces,serif" value="${t.rest>0?t.rest.toFixed(2).replace('.',','):''}" ${t.rest>0?'autofocus':''}>

function pgAdd(i){const m=meiosAtivos()[i];if(!m||!PG)return;const t=pgTotais();let v=r2(num($('#pgValor').value));if(!(v>0))v=t.rest;const din=ehDinheiro(m);if(!din)v=Math.min(v,t.rest);if(!(v>0))return toast('Nada a receber');

async function enviarFlow(cxId){const c=S.caixas[cxId];if(!c)return false;if(DEMO){toast('Na demonstração nada é enviado ao Flow');return false;}
  const r=resumoCaixa(c);if(!r.n){emit('cx_flow',{caixa_id:cxId,dados:{ok:true,status:'sem_vendas'}});refresh(true);return true;}
  if(!navigator.onLine){toast('Sem internet. O envio ao Flow fica pendente na tela Caixa.',5000);return false;}
  const tk=await tokenFlow();if(!tk){toast('Falta a ligação com o Flow. Veja Ajustes, seção Flow.',5500);return false;}
  const body={data:c.data,pdv:'Flow PDV',chave:'flowpdv-'+cxId,itens:r.itens.map(i=>({codigo:i.codigo,nome:i.nome,qtd:i.qtd,valor:i.valor})),receitas:r.porMeio.filter(m=>m.valor>0).map(m=>({forma:m.nome,valor:m.valor,pedidos:m.n}))};
  try{const resp=await fetch(API_FLOW+'/v1/vendas',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},body:JSON.stringify(body)});const j=await resp.json().catch(()=>({}));

/* ---------- senha do gerente ---------- */
// A configuração é lida por todos os terminais, então a senha fica só como resumo (não é cofre: é trava de operação).
function pinResumo(p){let a=2166136261,b=5381;const s='fpdv:'+String(p);for(let i=0;i<s.length;i++){a=Math.imul(a^s.charCodeAt(i),16777619)>>>0;b=(Math.imul(b,33)^s.charCodeAt(i))>>>0;}return a.toString(16).padStart(8,'0')+b.toString(16).padStart(8,'0');}
let _pinRes=null;
function exigirPin(motivo){const h=cfg().pinHash;if(!h)return Promise.resolve(true);
  return new Promise(res=>{pinFim(false);_pinRes=res;const d=document.createElement('div');d.id='pinRoot';d.innerHTML=`<div class="modal" style="width:min(380px,100%)"><div class="m-h"><div><div class="kicker">Senha do gerente</div><h2 style="font-size:19px">${esc(motivo||'Confirmar')}</h2></div></div>
    <div class="m-b"><input class="input num" id="pinIn" type="password" inputmode="numeric" autocomplete="off" style="font-size:24px;text-align:center;letter-spacing:6px" onkeydown="if(event.key==='Enter'){event.preventDefault();pinOk();}"><div id="pinErr" class="mini" style="color:var(--red);min-height:18px;margin-top:6px"></div></div>
    <div class="m-f"><button class="btn btn-o" onclick="pinFim(false)">Cancelar</button><button class="btn btn-p" onclick="pinOk()">Confirmar</button></div></div>`;
    d.addEventListener('click',e=>{if(e.target===d)pinFim(false);});document.body.appendChild(d);setTimeout(()=>{const i=$('#pinIn');if(i)i.focus();},40);});}
function pinOk(){const i=$('#pinIn');if(!i)return;if(pinResumo(i.value)===cfg().pinHash)pinFim(true);else{i.value='';$('#pinErr').textContent='Senha incorreta';bip(false);}}
function pinFim(ok){const d=$('#pinRoot');if(d)d.remove();const r=_pinRes;_pinRes=null;if(r)r(!!ok);}
async function pinDefinir(){if(!(await exigirPin('Trocar a senha')))return;const a=prompt('Nova senha do gerente (só números, de 4 a 8 dígitos):');if(a===null)return;if(!/^\d{4,8}$/.test(a))return toast('Use de 4 a 8 números');const b=prompt('Digite a senha de novo:');if(a!==b)return toast('As senhas não conferem');
  salvarCfg(c=>{c.pinHash=pinResumo(a);});AJ=null;toast('Senha do gerente definida');viewAjustes();}
async function pinRemover(){if(!(await exigirPin('Remover a senha')))return;salvarCfg(c=>{c.pinHash='';});AJ=null;toast('Senha removida');viewAjustes();}

let CONTA=null,DRAFT=null;   // CONTA={id,mesa,numero}; DRAFT={q:{prodId:{qtd,obs}},cat,busca}
const comandaDaMesa=m=>comandasAbertas().find(c=>String(c.mesa)===String(m))||null;
const minutos=ts=>Math.max(0,Math.round((Date.now()-Date.parse(ts))/60000));
const fTempo=m=>m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60);
function statusCozinha(c){let pronto=0,fila=0;(c?c.itens:[]).forEach(i=>{if(!i.setor)return;const k=S.kd[i.id];const st=k?k.st:'novo';if(st==='pronto')pronto++;else if(st!=='entregue')fila++;});return {pronto,fila};}
function viewMesas(){if(CONTA)return contaView();const n=cfg().nMesas,ab=comandasAbertas();const soltas=ab.filter(c=>!c.mesa);
  const cartao=(titulo,c,acao)=>{const k=statusCozinha(c);return `<button class="mesa ${c?(c.conta?'conta':'ocup'):''}" onclick="${acao}"><b>${titulo}</b>${c?`<span class="num v">${brl(cmdTotal(c))}</span><span class="mini">${fTempo(minutos(c.abertaEm))}${c.pessoas?' · '+c.pessoas+' pess.':''}</span>${c.conta?'<span class="tag tag-a">Pediu a conta</span>':(k.pronto?'<span class="tag tag-g">Pedido pronto</span>':(k.fila?'<span class="tag tag-n">Na cozinha</span>':''))}`:'<span class="mini">Livre</span>'}</button>`;};
  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div><div class="kicker">Atendimento${LOCAL.operador?' · '+esc(LOCAL.operador):''}</div><h2>Mesas e comandas</h2></div>

  if(n>0){h+='<div class="mesas">';for(let i=1;i<=n;i++)h+=cartao('Mesa '+i,comandaDaMesa(i),`abrirMesa('${i}')`);h+='</div>';}
  else h+=`<div class="card pad mini" style="margin-bottom:14px">Para usar mesas, informe quantas são em Ajustes, na seção Salão. As comandas funcionam sem isso.</div>`;
  if(soltas.length)h+=`<h3 style="margin:18px 0 10px">Comandas abertas</h3><div class="mesas">${soltas.map(c=>cartao(c.numero?'Comanda '+esc(c.numero):'Balcão '+fHora(c.abertaEm),c,`abrirConta('${c.id}')`)).join('')}</div>`;
  $('#view').innerHTML=h;}
function abrirMesa(m){const c=comandaDaMesa(m);CONTA={id:c?c.id:null,mesa:String(m),numero:c?c.numero:''};viewMesas();}
function abrirComandaNum(n){n=String(n||'').trim();if(!n)return;const c=comandasAbertas().find(x=>String(x.numero)===n);CONTA={id:c?c.id:null,mesa:c?c.mesa:'',numero:n};viewMesas();}
function abrirConta(id){const c=S.comandas[id];if(!c)return;CONTA={id,mesa:c.mesa||'',numero:c.numero||''};viewMesas();}
function contaAtual(){return CONTA&&CONTA.id?S.comandas[CONTA.id]||null:null;}
function contaId(){if(!CONTA.id){const c=CONTA.mesa?comandaDaMesa(CONTA.mesa):(CONTA.numero?comandasAbertas().find(x=>String(x.numero)===CONTA.numero):null);CONTA.id=c?c.id:uid();}return CONTA.id;}

  const titulo=CONTA.mesa?'Mesa '+CONTA.mesa:(CONTA.numero?'Comanda '+CONTA.numero:'Balcão');const its=c?agrupar(c.itens):[];const sub=cmdTotal(c),sp=servDe(c||CONTA),serv=r2(sub*sp/100);
  $('#view').innerHTML=`<div class="conta"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><button class="btn btn-o btn-sm" onclick="CONTA=null;viewMesas()">← Mesas</button>
      <div style="text-align:right"><h2 style="margin:0">${esc(titulo)}</h2><div class="mini">${c?fTempo(minutos(c.abertaEm)):'livre'}${c&&c.pessoas?' · '+c.pessoas+' pessoa(s)':''}${c&&c.nome?' · '+esc(c.nome):''}${c&&c.mesa&&c.numero?' · comanda '+esc(c.numero):''}</div></div></div>
    ${c&&c.conta?'<div class="aviso">O cliente pediu a conta.</div>':''}
    <div class="card pad" style="padding-top:6px;padding-bottom:6px">${its.length?its.map((i,k)=>{const sts=i.ids.map(id=>S.kd[id]?S.kd[id].st:'novo');const tg=!i.setor?'':(sts.every(x=>x==='entregue')?'':(sts.some(x=>x==='pronto')?'<span class="tag tag-g">Pronto</span>':(sts.some(x=>x==='preparo')?'<span class="tag tag-a">Preparando</span>':'<span class="tag tag-n">Na cozinha</span>')));
        return `<div class="it"><div><b>${i.tipo==='peso'?'':fq(i.qtd)+'× '}${esc(i.nome)}</b> ${tg}<div class="mini">${i.tipo==='peso'?fkg(i.qtd)+' kg × '+brl(i.preco):brl(i.preco)+' cada'}${i.obs?' · '+esc(i.obs):''}</div></div><div style="text-align:right"><div class="v">${brl(i.total)}</div><button class="mini" style="text-decoration:underline" onclick="contaTirar(${k})">tirar um</button></div></div>`;}).join(''):'<div class="vazio">Nenhum item lançado.</div>'}</div>
    <div class="card pad" style="margin-top:12px"><div class="linha"><span>Subtotal</span><b>${brl(sub)}</b></div>${sp?`<div class="linha"><span>Taxa de serviço de ${fq(sp)}%</span><b>${brl(serv)}</b></div>`:''}<div class="linha"><span><b>Total</b></span><b style="font:600 24px Fraunces,serif">${brl(r2(sub+serv))}</b></div>
      ${c&&c.pessoas>1?`<div class="mini" style="text-align:right">${brl(r2((sub+serv)/c.pessoas))} por pessoa</div>`:''}</div>
    <div class="conta-ac"><button class="btn btn-p btn-xl" onclick="pickerAbrir()">Adicionar itens</button><button class="btn btn-g btn-xl" ${its.length?'':'disabled'} onclick="receber(CONTA.id)">Receber</button>
      <button class="btn btn-o" ${its.length?'':'disabled'} onclick="contaPedirConta()">Pedir a conta</button><button class="btn btn-o" onclick="contaPessoas()">Pessoas</button><button class="btn btn-o" onclick="contaNome()">Nome</button>
      <button class="btn btn-o" ${its.length?'':'disabled'} onclick="contaTransferir()">Transferir</button><button class="btn btn-o" ${c?'':'disabled'} onclick="contaCancelar()">Cancelar</button></div></div>`;}
function contaMeta(d){const id=contaId();emit('cm_meta',{ref:id,dados:Object.assign({mesa:CONTA.mesa||'',numero:CONTA.numero||''},d)});viewMesas();}
function contaPessoas(){const c=contaAtual();const v=prompt('Quantas pessoas?',c&&c.pessoas?c.pessoas:'');if(v===null)return;contaMeta({pessoas:Math.max(0,parseInt(v)||0),fixa:true});}
function contaNome(){const c=contaAtual();const v=prompt('Nome do cliente:',c&&c.nome?c.nome:'');if(v===null)return;contaMeta({nome:v.trim().slice(0,40),fixa:true});}
function contaPedirConta(){const c=contaAtual();if(!c)return;contaMeta({conta:true});if(LOCAL.modo==='caixa')imprimirConta(c.id);else toast('Conta pedida. O caixa já foi avisado.');}
async function contaTirar(k){const c=contaAtual();if(!c)return;const g=agrupar(c.itens)[k];if(!g)return;const id=g.ids[g.ids.length-1];const k0=S.kd[id];
  if(g.setor&&k0&&k0.st!=='novo'&&!(await exigirPin('Tirar item que já está em preparo')))return;emit('cm_del',{ref:c.id,dados:{itemId:id,por:LOCAL.operador||CTX.email}});viewMesas();}
async function contaCancelar(){const c=contaAtual();if(!c){CONTA=null;return viewMesas();}if(!confirm('Cancelar '+rotulo(c)+(c.itens.length?' e apagar os '+c.itens.length+' item(ns)?':'?')))return;if(c.itens.length&&!(await exigirPin('Cancelar '+rotulo(c))))return;
  emit('cm_canc',{ref:c.id,dados:{por:LOCAL.operador||CTX.email}});CONTA=null;viewMesas();}
function contaTransferir(){const c=contaAtual();if(!c)return;modal(`<div class="m-h"><div><div class="kicker">${esc(rotulo(c))}</div><h2>Transferir</h2></div></div>
  <div class="m-b"><div class="g2" style="gap:10px"><div><label class="lb">Para a mesa</label><input class="input num" id="trMesa" inputmode="numeric" placeholder="nº" autofocus></div><div><label class="lb">Ou para a comanda</label><input class="input num" id="trNum" inputmode="numeric" placeholder="nº"></div></div>
    <div class="mini" style="margin:12px 0 6px">Desmarque o que deve ficar onde está.</div>${c.itens.map(i=>`<label class="linha" style="cursor:pointer"><span style="display:flex;gap:10px;align-items:center"><input type="checkbox" class="trIt" value="${i.id}" checked> ${esc(i.nome)}${i.tipo==='peso'?' '+fkg(i.qtd)+' kg':''}</span><b>${brl(i.total)}</b></label>`).join('')}</div>
  <div class="m-f"><button class="btn btn-o" onclick="fecharModal()">Voltar</button><button class="btn btn-p" onclick="contaTransferirOk()">Transferir</button></div>`);}
function contaTransferirOk(){const c=contaAtual();if(!c)return fecharModal();const m=$('#trMesa').value.trim(),n=$('#trNum').value.trim();if(!m&&!n)return toast('Informe a mesa ou a comanda de destino');
  if(m&&(parseInt(m)<1||parseInt(m)>cfg().nMesas))return toast('Mesa '+m+' não existe');
  const dst=m?comandaDaMesa(m):comandasAbertas().find(x=>String(x.numero)===n);if(dst&&dst.id===c.id)return toast('O destino é a própria conta');
  const ids=$$('.trIt').filter(x=>x.checked).map(x=>x.value);if(!ids.length)return toast('Marque ao menos um item');const todos=ids.length===c.itens.length;
  emit('cm_move',{ref:c.id,dados:{destinoId:dst?dst.id:uid(),destinoMesa:m||'',destinoNumero:m?'':n,itemIds:todos?undefined:ids,todos,por:LOCAL.operador||CTX.email}});
  fecharModal();toast('Transferido para '+(m?'a mesa '+m:'a comanda '+n));if(todos)CONTA=null;viewMesas();}
function imprimirConta(id){const c=S.comandas[id];if(!c)return;const sub=cmdTotal(c),sp=servDe(c),serv=r2(sub*sp/100),tot=r2(sub+serv);
  imprimir(`<h4>${esc(CAT.restaurante||CTX.orgNome)}</h4><div class="c">Conferência de ${esc(rotulo(c))} · ${fData(new Date().toISOString())} ${fHora(Date.now())}</div><hr>${agrupar(c.itens).map(i=>`<div>${esc(i.nome)}</div>`+pl(i.tipo==='peso'?fkg(i.qtd)+' kg x '+brl(i.preco):fq(i.qtd)+' x '+brl(i.preco),brl(i.total))).join('')}<hr>
  ${pl('Subtotal',brl(sub))}${serv?pl('Serviço '+fq(sp)+'%',brl(serv)):''}${pl('TOTAL',brl(tot),'t')}${c.pessoas>1?pl('Por pessoa ('+c.pessoas+')',brl(r2(tot/c.pessoas))):''}<hr><div class="c">Conferência de consumo. Não é documento fiscal.</div>`);}
/* escolha de itens: monta o pedido e só então envia (a cozinha recebe tudo de uma vez) */
function pickerAbrir(){DRAFT={q:{},cat:'Todos',busca:''};pickerUI();}
function pickerUI(){const off=cfg().itensOff,fs=CAT.fichas.filter(f=>!off.includes(f.id));const cats=['Todos',...new Set(fs.map(f=>f.cat))];const b=normTxt(DRAFT.busca);
  const l=fs.filter(f=>(DRAFT.cat==='Todos'||f.cat===DRAFT.cat)&&(!b||normTxt(f.nome).includes(b)||normTxt(f.cod).includes(b))).slice(0,200);
  const tot=Object.entries(DRAFT.q).reduce((s,[id,x])=>{const f=CAT.fichas.find(y=>y.id===id);return {n:s.n+x.qtd,v:r2(s.v+(f?f.preco*x.qtd:0))};},{n:0,v:0});
  modal(`<div class="m-h"><div><div class="kicker">${esc(CONTA.mesa?'Mesa '+CONTA.mesa:(CONTA.numero?'Comanda '+CONTA.numero:'Balcão'))}</div><h2>Adicionar itens</h2></div><button class="btn btn-o btn-sm" onclick="DRAFT=null;fecharModal()">Voltar</button></div>
  <div class="m-b" style="padding-bottom:0"><input class="input" id="pkBusca" placeholder="Buscar item" value="${esc(DRAFT.busca)}" oninput="DRAFT.busca=this.value;pickerLista()">
    <div class="chips" style="flex-wrap:nowrap;overflow:auto;padding:10px 0 4px">${cats.map(c=>`<button class="chip ${DRAFT.cat===c?'on':''}" data-c="${esc(c)}" onclick="DRAFT.cat=this.dataset.c;pickerUI()">${esc(c)}</button>`).join('')}</div>
    <div id="pkLista" style="max-height:48vh;overflow:auto"></div></div>
  <div class="m-f"><button class="btn btn-p btn-xl" style="flex:1" id="pkEnviar" ${tot.n?'':'disabled'} onclick="pickerEnviar()">Enviar pedido · ${tot.n} item(ns) · ${brl(tot.v)}</button></div>`,true);pickerLista();}
function pickerLista(){const off=cfg().itensOff,b=normTxt(DRAFT.busca);const l=CAT.fichas.filter(f=>!off.includes(f.id)&&(DRAFT.cat==='Todos'||f.cat===DRAFT.cat)&&(!b||normTxt(f.nome).includes(b)||normTxt(f.cod).includes(b))).slice(0,200);
  const el=$('#pkLista');if(!el)return;el.innerHTML=l.map(f=>{const x=DRAFT.q[f.id];return `<div class="it" style="align-items:center"><div><b>${esc(f.nome)}</b><div class="mini">${brl(f.preco)}${x&&x.obs?' · '+esc(x.obs):''}${x?` · <a style="cursor:pointer;text-decoration:underline" data-id="${esc(f.id)}" onclick="pickerObs(this.dataset.id)">${x.obs?'trocar observação':'observação'}</a>`:''}</div></div>
      <span class="qt"><button data-id="${esc(f.id)}" onclick="pickerQtd(this.dataset.id,-1)">−</button><b class="num" style="min-width:22px;text-align:center">${x?x.qtd:0}</b><button data-id="${esc(f.id)}" onclick="pickerQtd(this.dataset.id,1)">+</button></span></div>`;}).join('')||'<div class="vazio">Nenhum item encontrado.</div>';
  const tot=Object.entries(DRAFT.q).reduce((s,[id,x])=>{const f=CAT.fichas.find(y=>y.id===id);return {n:s.n+x.qtd,v:r2(s.v+(f?f.preco*x.qtd:0))};},{n:0,v:0});const bt=$('#pkEnviar');if(bt){bt.disabled=!tot.n;bt.textContent='Enviar pedido · '+tot.n+' item(ns) · '+brl(tot.v);}}
function pickerQtd(id,d){const x=DRAFT.q[id]||(DRAFT.q[id]={qtd:0,obs:''});x.qtd=Math.max(0,Math.min(99,x.qtd+d));if(!x.qtd)delete DRAFT.q[id];pickerLista();}
function pickerObs(id){const x=DRAFT.q[id];if(!x)return;const v=prompt('Observação para a cozinha:',x.obs||'');if(v===null)return;x.obs=v.trim().slice(0,80);pickerLista();}
function pickerEnviar(){const ent=Object.entries(DRAFT.q);if(!ent.length)return;const cid=contaId(),ped=uid();let n=0,coz=0;
  ent.forEach(([id,x])=>{const f=CAT.fichas.find(y=>y.id===id);if(!f)return;for(let k=0;k<x.qtd;k++){const it=Object.assign({id:uid(),garcom:LOCAL.operador||'',pedidoId:ped},itemDeFicha(f,x.obs));if(it.setor)coz++;emit('cm_item',{ref:cid,dados:{numero:CONTA.numero||'',mesa:CONTA.mesa||'',item:it}});n++;}});
  DRAFT=null;fecharModal();bip();toast(n+' item(ns) lançado(s)'+(coz?' · '+coz+' na cozinha':''));viewMesas();}

/* ---------- tela da cozinha ---------- */
let KD_N=-1;
function cozinhaGrupos(setor){const lim=Date.now()-12*36e5,out={};
  Object.values(S.ped).forEach(p=>{if(p.canc||p.it.setor!==setor||Date.parse(p.it.em)<lim)return;const k=S.kd[p.it.id],st=k?k.st:'novo';if(st==='entregue'||(st==='pronto'&&Date.now()-Date.parse(k.em)>15*6e4))return;
    const gid=(p.it.pedidoId||p.cid)+'|'+st;const g=out[gid]||(out[gid]={gid,st,mesa:p.mesa,numero:p.numero,em:p.it.em,garcom:p.it.garcom||'',linhas:{},ids:[]});
    const lk=p.it.nome+'|'+(p.it.obs||'');const l=g.linhas[lk]||(g.linhas[lk]={nome:p.it.nome,obs:p.it.obs||'',qtd:0});l.qtd+=+p.it.qtd||1;g.ids.push(p.it.id);if(Date.parse(p.it.em)<Date.parse(g.em))g.em=p.it.em;});
  return Object.values(out).sort((a,b)=>Date.parse(a.em)-Date.parse(b.em));}
function setorAtual(){const ss=cfg().setores;return ss.find(x=>x.id===LOCAL.setor)||ss[0];}
function kdSom(){const n=cozinhaGrupos(setorAtual().id).filter(g=>g.st==='novo').length;if(KD_N>=0&&n>KD_N)bip();KD_N=n;}
function viewCozinha(){const c=cfg(),st=setorAtual(),gs=cozinhaGrupos(st.id);const usa=Object.values(c.catSetor).some(v=>v);
  const col=(titulo,est,prox,acao)=>{const l=gs.filter(g=>g.st===est);return `<div class="kcol"><div class="kicker" style="margin-bottom:8px">${titulo} · ${l.length}</div>${l.map(g=>{const m=minutos(g.em);return `<button class="kcard ${est} ${est!=='pronto'&&m>=15?'atras':''}" data-g="${esc(g.gid)}" onclick="kdAvancar(this.dataset.g,'${prox}')"><div class="kh"><b>${g.mesa?'Mesa '+esc(g.mesa):(g.numero?'Comanda '+esc(g.numero):'Balcão')}</b><span>${fTempo(m)}</span></div>
      ${Object.values(g.linhas).map(x=>`<div class="kl"><b>${fq(x.qtd)}×</b> ${esc(x.nome)}${x.obs?`<div class="ko">${esc(x.obs)}</div>`:''}</div>`).join('')}<div class="kf">${g.garcom?esc(g.garcom)+' · ':''}toque para ${acao}</div></button>`;}).join('')||'<div class="mini" style="padding:10px 2px">Nada aqui.</div>'}</div>`;};
  $('#view').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div><div class="kicker">Preparo</div><h2>${esc(st.nome)}</h2></div>
    ${c.setores.length>1?`<div class="chips">${c.setores.map(x=>`<button class="chip ${x.id===st.id?'on':''}" onclick="locSet('setor','${x.id}');KD_N=-1;viewCozinha()">${esc(x.nome)}</button>`).join('')}</div>`:''}</div>
  ${usa?`<div class="kds">${col('Novos','novo','preparo','começar')}${col('Preparando','preparo','pronto','marcar pronto')}${col('Prontos','pronto','entregue','entregar')}</div>`:`<div class="card pad">Nenhuma categoria do cardápio está ligada a um setor. Em Ajustes, na seção Cozinha, escolha para onde vai cada categoria.</div>`}`;
  if(KD_N<0)KD_N=gs.filter(g=>g.st==='novo').length;}
function kdAvancar(gid,st){const g=cozinhaGrupos(setorAtual().id).find(x=>x.gid===gid);if(!g)return;emit('kd',{dados:{ids:g.ids,st,por:LOCAL.operador||LOCAL.terminal}});KD_N=-1;viewCozinha();}

/* ---------- balança de autoatendimento ---------- */
let TOT={num:'',ok:null,t:null};
function viewBalanca(){const p=pesoSel();const ant=$('#pesoIn');const antV=ant&&!BAL.on?ant.value:'';
  $('#view').innerHTML=`<div class="totem"><div class="tot-l"><div class="bal-st"><i class="dot" id="balDot"></i><span id="balTxt"></span></div><div class="kicker" style="margin-top:14px;color:var(--gold-soft)">${esc(p.nome)} · ${brl(precoKgDe(p))} o quilo</div>
      <div class="peso"><input id="pesoIn" class="num" inputmode="decimal" placeholder="0,000" autocomplete="off" oninput="pesoUI()"><span>kg</span></div><div class="bal-sub" id="balSub"></div><div class="mini" id="balConta" style="color:#C9D2E6;margin-top:16px"></div><div class="bal-val num" id="balValor" style="font-size:54px"></div>
      ${LOCAL.balSim?`<div style="margin-top:14px;display:flex;gap:6px"><button class="chip" onclick="balSimular()">Simular prato</button><button class="chip" onclick="balSimular(0)">Esvaziar</button></div>`:''}</div>
    <div class="tot-r">${TOT.ok?`<div class="tot-ok"><div class="kicker">Lançado</div><h2 style="font-size:30px;margin:6px 0">Comanda ${esc(TOT.ok.n)}</h2><div class="num" style="font:600 26px Fraunces,serif">${fkg(TOT.ok.kg)} kg · ${brl(TOT.ok.valor)}</div><div class="mini" style="margin-top:10px">Bom apetite!</div></div>`
      :`<label class="lb" style="text-align:center">Número da sua comanda</label><div class="tot-num num">${esc(TOT.num)||'<span style="opacity:.3">0</span>'}</div>
      <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="totTecla('${d}')">${d}</button>`).join('')}<button onclick="totApagar()" style="font-size:18px">Apagar</button><button onclick="totTecla('0')">0</button><button class="ok" onclick="totConfirmar()">Confirmar</button></div>`}</div></div>`;
  if(antV)$('#pesoIn').value=antV;pesoUI();}
function totTecla(d){if(TOT.ok)return;if(TOT.num.length<6){TOT.num+=d;viewBalanca();}}
function totApagar(){if(TOT.ok)return;TOT.num=TOT.num.slice(0,-1);viewBalanca();}
function totConfirmar(){if(TOT.ok)return;const n=TOT.num.replace(/^0+/,''),pc=pesoCalc(),p=pesoSel();
  if(!n)return (bip(false),toast('Digite o número da comanda'));if(!(pc.preco>0))return toast('Preço do quilo não definido');if(!(pc.liq>0))return (bip(false),toast('Coloque o prato na balança'));if(BAL.on&&!balEstavel())return (bip(false),toast('Aguarde o peso estabilizar'));
  CUR={comandaId:null,numero:n};selComanda(n,true);addItem({tipo:'peso',prodId:p.id,nome:p.nome,codigo:p.codigo||'',cat:'',qtd:pc.liq,preco:pc.preco,total:pc.valor,bruto:pc.bruto,tara:pc.tara});CUR={comandaId:null,numero:''};
  bip();const i=$('#pesoIn');if(i&&!BAL.on)i.value='';clearTimeout(TOT.t);TOT={num:'',ok:{n,kg:pc.liq,valor:pc.valor},t:setTimeout(()=>{TOT.ok=null;if(ROUTE==='balanca')viewBalanca();},3200)};viewBalanca();}

/* ---------- relatórios ---------- */
let REL={p:'hoje'};
function relPeriodo(){const h=new Date();h.setHours(0,0,0,0);const d=n=>new Date(h.getTime()-n*864e5);const fim=new Date(h.getTime()+864e5);
  return ({hoje:[h,fim,'Hoje'],ontem:[d(1),h,'Ontem'],sem:[d(6),fim,'Últimos 7 dias'],mes:[new Date(h.getFullYear(),h.getMonth(),1),fim,'Este mês'],tudo:[d(DIAS_GUARDA),fim,'Últimos '+DIAS_GUARDA+' dias']})[REL.p];}
function relVendas(){const [a,b]=relPeriodo();return Object.values(S.vendas).filter(v=>{const t=Date.parse(v.em);return t>=a.getTime()&&t<b.getTime();}).sort((x,y)=>Date.parse(x.em)-Date.parse(y.em));}
function viewRelatorios(){const vs=relVendas(),r=resumoCaixa(null,vs),per=relPeriodo();const mxD=Math.max(1,...r.dias.map(d=>d.total));
  const tab=(tit,cab,linhas)=>`<div class="card pad"><h3>${tit}</h3>${linhas.length?`<div style="overflow:auto"><table><thead><tr>${cab.map((c,i)=>`<th class="${i?'r':''}">${c}</th>`).join('')}</tr></thead><tbody>${linhas.map(l=>`<tr>${l.map((c,i)=>`<td class="${i?'r num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="mini">Sem vendas no período.</div>'}</div>`;
  $('#view').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div><div class="kicker">Relatórios</div><h2>${per[2]}</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="chips">${[['hoje','Hoje'],['ontem','Ontem'],['sem','7 dias'],['mes','Mês'],['tudo','Tudo']].map(([k,l])=>`<button class="chip ${REL.p===k?'on':''}" onclick="REL.p='${k}';viewRelatorios()">${l}</button>`).join('')}</div><button class="btn btn-o btn-sm" onclick="relCSV()">Baixar planilha</button></div></div>
  <div class="painel">${[['Faturamento',brl(r.total)],['Vendas',r.n],['Ticket médio',brl(r.ticket)],['Quilos vendidos',fkg(r.kg)],['Peso médio do prato',fkg(r.pesoMedio)+' kg']].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div></div>`).join('')}</div>
  <div class="g2">${tab('Por forma de pagamento',['Forma','Recebimentos','Valor'],r.porMeio.map(m=>[esc(m.nome),m.n,brl(m.valor)]))}${tab('Por dia',['Dia','Vendas','Total'],r.dias.map(d=>[fData(d.dia)+`<div style="height:4px;border-radius:2px;background:var(--gold);width:${Math.round(d.total/mxD*100)}%;margin-top:4px"></div>`,d.n,brl(d.total)]))}</div>
  <div class="g2" style="margin-top:16px">${tab('Itens vendidos',['Item','Quantidade','Valor'],r.itens.slice(0,60).map(i=>[esc(i.nome),i.peso?fkg(i.qtd)+' kg':fq(i.qtd),brl(i.valor)]))}${tab('Por garçom',['Garçom','Vendas','Total','Taxa de serviço'],r.garcons.map(g=>[esc(g.nome),g.n,brl(g.total),brl(g.serv)]))}</div>
  <div class="mini" style="margin-top:12px">${r.desc?'Descontos '+brl(r.desc)+'. ':''}${r.serv?'Taxa de serviço '+brl(r.serv)+'. ':''}${r.canceladas?r.canceladas+' venda(s) cancelada(s) fora da conta. ':''}Este aparelho guarda ${DIAS_GUARDA} dias de movimento.</div>`;}
function relCSV(){const vs=relVendas();if(!vs.length)return toast('Sem vendas no período');const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const n=v=>String(r2(v)).replace('.',',');
  const L=[['Data','Hora','Venda','Mesa','Comanda','Garçom','Itens','Subtotal','Desconto','Serviço','Total','Formas','Troco','Situação'].map(q).join(';')];
  vs.forEach(v=>L.push([fData(v.em),fHora(v.em),v.numero,v.mesa||'',v.comandaNumero||'',v.garcom||'',(v.itens||[]).map(i=>(i.tipo==='peso'?fkg(i.qtd)+' kg ':fq(i.qtd)+'x ')+i.nome).join(' | '),n(v.subtotal),n(v.desconto),n(v.servico),n(v.total),(v.pagamentos||[]).map(p=>p.nome+' '+n(p.valor)).join(' | '),n(v.troco),v.cancelada?'cancelada':'ok'].map(q).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='flow-pdv-vendas-'+hojeISO()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}


/* ---------- atalhos e partida ---------- */
const VIEWS={venda:viewVenda,mesas:viewMesas,cozinha:viewCozinha,balanca:viewBalanca,caixa:viewCaixa,vendas:viewVendas,relatorios:viewRelatorios,ajustes:viewAjustes};
document.addEventListener('keydown',e=>{if(!CTX||!S)return;
  if($('#pinRoot')){if(e.key==='Escape')pinFim(false);return;}
  if(modalAberto()){if(e.key==='Escape'){PG=null;fecharModal();}else if(e.key==='Enter'&&PG&&PG.tela==='pagar'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){const t=pgTotais();if(t.rest<=0&&PG.pags.length){e.preventDefault();pgConcluir();}}return;}
  if(ROUTE==='balanca'){if(document.activeElement&&document.activeElement.id==='pesoIn')return;if(/^\d$/.test(e.key)){e.preventDefault();totTecla(e.key);}else if(e.key==='Backspace'){e.preventDefault();totApagar();}else if(e.key==='Enter'){e.preventDefault();totConfirmar();}return;}
  if(ROUTE!=='venda')return;
  if(e.key==='F2'){e.preventDefault();lancarPeso();}else if(e.key==='F4'){e.preventDefault();receber();}else if(e.key==='F8'){e.preventDefault();guardar();}
  else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();const b=$('#busca');if(b)b.focus();}});
window.addEventListener('online',()=>{statusUI();syncNow();if(!RT_OK)rtLigar();});window.addEventListener('offline',statusUI);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();

</script>
